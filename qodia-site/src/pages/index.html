<section class="brand-band hero" aria-labelledby="hero-title">
  <div class="brand-band__motif" aria-hidden="true"></div>
  <div class="wrap">
    <div class="hero__content">
      <span class="badge badge--light" style="justify-self:start"><!--@t:hero.badge--></span>
      <h1 class="display-xl" id="hero-title"><!--@t:hero.title--></h1>
      <p class="hero__lead"><!--@t:hero.lead--></p>
    </div>
    <form class="finder" action="/annuaire" method="get" role="search" aria-label="Trouver un expert">
      <label><span>Je cherche</span><input name="q" placeholder="Un nom, un besoin : refonte, SEO, vidéo…" autocomplete="off"></label>
      <label><span>Expertise</span><select name="expertise"><option value="">Toutes les expertises</option><!--@family-options--></select></label>
      <label><span>Secteur</span><select name="secteur"><option value="">Tous les secteurs</option><!--@sector-options--></select></label>
      <button class="btn btn--accent" type="submit">Trouver <!--@icon-arrow--></button>
    </form>
    <p class="hero__alt" style="margin-top:var(--space-6)"><!--@t:hero.helpBefore--> <a href="/brief"><!--@t:hero.helpLink--></a><!--@t:hero.helpAfter--></p>
  </div>
</section>
<div class="colorstrip" aria-hidden="true"><span style="background:var(--rouge)"></span><span style="background:var(--jaune)"></span><span style="background:var(--cyan)"></span><span style="background:var(--violet)"></span></div>

<section class="logos" aria-labelledby="logos-title">
  <div class="wrap">
    <p class="label logos__label" id="logos-title"><!--@t:logos.label--></p>
    <!--@logos-->
  </div>
</section>

    <div class="grid grid--2">
      <div class="mode">
        <span class="label"><!--@t:how.mode1Label--></span>
        <span class="mode__num">01</span>
        <h3 class="h2"><!--@t:how.mode1Title--></h3>
        <p class="muted"><!--@t:how.mode1Text--></p>
        <ol class="mode__steps">
          <li><!--@t:how.mode1Step1--></li>
          <li><!--@t:how.mode1Step2--></li>
          <li><!--@t:how.mode1Step3--></li>
        </ol>
        <a class="btn btn--secondary" href="/annuaire"><!--@t:how.mode1Button--></a>
      </div>
      <div class="mode mode--brand on-brand">
        <span class="label"><!--@t:how.mode2Label--></span>
        <span class="mode__num">02</span>
        <h3 class="h2"><!--@t:how.mode2Title--></h3>
        <p class="muted"><!--@t:how.mode2Text--></p>
        <ol class="mode__steps">
          <li><!--@t:how.mode2Step1--></li>
          <li><!--@t:how.mode2Step2--></li>
          <li><!--@t:how.mode2Step3--></li>
        </ol>
        <a class="btn btn--accent" href="/brief?mode=pilote"><!--@t:how.mode2Button--></a>
      </div>
    </div>
  </div>
</section>

<section class="section section--alt" aria-labelledby="circle-title">
